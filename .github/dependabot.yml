version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    rebase-strategy: "auto"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # The action has branches for Rust versions that are not released yet;
      # the toolchain is bumped manually.
      - dependency-name: "dtolnay/rust-toolchain"
  - package-ecosystem: "cargo"
    directory: "/"
    rebase-strategy: "auto"
    schedule:
      interval: "weekly"
    allow:
      # Also bump transitive dependencies in Cargo.lock.
      - dependency-type: "all"
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
